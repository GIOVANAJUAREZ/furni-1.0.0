<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de Sesión / Registro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}
body{background:linear-gradient(to right,#e2e2e2,#c9d6ff);display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh}
.container{background:#fff;border-radius:30px;box-shadow:0 5px 15px rgba(0,0,0,0.35);position:relative;overflow:hidden;width:768px;max-width:100%;min-height:480px}
.container form{background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0 40px;height:100%}
.container input{background:#eee;border:none;margin:8px 0;padding:10px 15px;font-size:13px;border-radius:8px;width:100%;outline:none}
.container button{background:#512da8;color:#fff;font-size:12px;padding:10px 45px;border:1px solid transparent;border-radius:8px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-top:10px;cursor:pointer}
.form-container{position:absolute;top:0;height:100%;transition:all 0.6s ease-in-out}
.sign-in{left:0;width:50%;z-index:2}
.container.active .sign-in{transform:translateX(100%)}
.sign-up{left:0;width:50%;opacity:0;z-index:1}
.container.active .sign-up{transform:translateX(100%);opacity:1;z-index:5;animation:move 0.6s}
@keyframes move{0%,49.99%{opacity:0;z-index:1}50%,100%{opacity:1;z-index:5}}
.toggle-container{position:absolute;top:0;left:50%;width:50%;height:100%;overflow:hidden;transition:all 0.6s ease-in-out;border-radius:150px 0 0 100px;z-index:1000}
.container.active .toggle-container{transform:translateX(-100%);border-radius:0 150px 100px 0}
.toggle{background:linear-gradient(to right,#5c6bc0,#512da8);color:#fff;position:relative;left:-100%;height:100%;width:200%;transform:translateX(0);transition:all 0.6s ease-in-out}
.container.active .toggle{transform:translateX(50%)}
.toggle-panel{position:absolute;width:50%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0 30px;text-align:center;top:0;transition:all 0.6s ease-in-out}
.toggle-left{transform:translateX(-200%)}
.container.active .toggle-left{transform:translateX(0)}
.toggle-right{right:0;transform:translateX(0)}
.container.active .toggle-right{transform:translateX(200%)}
button.show-panel{background:#fff;color:#512da8;border:1px solid #512da8;border-radius:8px;cursor:pointer;margin-top:15px;padding:10px 30px}
</style>
</head>
<body>

<div class="container" id="container">
    <!-- Registro -->
    <div class="form-container sign-up">
        <form id="registerForm">
            <h1>Crear Cuenta</h1>
            <span>o usa tu correo electrónico</span>
            <input type="text" id="regName" placeholder="Nombre completo" required>
            <input type="email" id="regEmail" placeholder="Correo electrónico" required>
            <input type="password" id="regPassword" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
    </div>

    <!-- Login -->
    <div class="form-container sign-in">
        <form id="loginForm">
            <h1>Iniciar Sesión</h1>
            <span>con tu correo y contraseña</span>
            <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
            <input type="password" id="loginPassword" placeholder="Contraseña" required>
            <a href="#">¿Olvidaste tu contraseña?</a>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <!-- Panel -->
    <div class="toggle-container">
        <div class="toggle">
            <div class="toggle-panel toggle-left">
                <h1>¡Bienvenido de nuevo!</h1>
                <p>Para seguir conectado, inicia sesión con tus datos</p>
                <button class="show-panel" id="login">Iniciar Sesión</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>¡Hola, Amigo!</h1>
                <p>Regístrate con tus datos personales</p>
                <button class="show-panel" id="register">Registrarse</button>
            </div>
        </div>
    </div>
</div>
<script src="../js/config.js"></script>
<script>
const API = window.ENV.API_HOST;
const container = document.getElementById('container');
const registerBtn = document.getElementById('register');
const loginBtn = document.getElementById('login');

registerBtn.addEventListener('click', ()=> container.classList.add("active"));
loginBtn.addEventListener('click', ()=> container.classList.remove("active"));

async function postJSON(url, data){
    try{
        const res = await fetch(url,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(data)
        });
        const text = await res.text();
        console.log("Respuesta servidor:", text);
        return JSON.parse(text);
    } catch(err){
        console.error("Error en fetch:",err);
        return {status:"error", error:"No se pudo conectar con el servidor"};
    }
}
// Registro
document.getElementById("registerForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    const data = await postJSON(`/auth/register`, {name, email, password});
    alert(data.message || data.error);
    if(data.status==="success") container.classList.remove("active");
});

// Login
document.getElementById("loginForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const data = await postJSON(`/auth/login`, {email, password});
    if(data.status==="success"){
        alert("Bienvenido "+data.user.name);
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location = "/"; // redirige al index.html
    } else {
        alert(data.error);
    }
});
</script>
</body>
</html>
